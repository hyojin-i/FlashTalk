services:
  flashtalk-blue:
    image: minseong426/flashtalk:latest
    expose:
      - "3001"
    env_file:
      - .env
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  flashtalk-green:
    image: minseong426/flashtalk:latest
    expose:
      - "3002"
    env_file:
      - .env
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./upstream.conf:/etc/nginx/conf.d/upstream.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: always