name: FlashTalk Deploy

on:
  push:
    branches:
      - main  

jobs: 
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true 
          platforms: linux/arm64
          tags: minseong426/flashtalk:latest

  deploy-to-ec2: 
    needs: build-and-push 
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: | 
            cd /home/ubuntu/flashtalk

            echo "NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}" > .env

            echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> .env
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}" >> .env
            echo "SUPABASE_SECRET_KEY=${{ secrets.SUPABASE_SECRET_KEY }}" >> .env
            echo "SUPABASE_JWT_KEY=${{ secrets.SUPABASE_JWT_KEY }}" >> .env
            echo "SUPABASE_STORAGE_BUCKET=${{ secrets.SUPABASE_STORAGE_BUCKET }}" >> .env
            echo "NEXT_PUBLIC_SUPABASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_SUPABASE_STORAGE_BUCKET }}" >> .env
            echo "CRON_SECRET=${{ secrets.CRON_SECRET }}" >> .env

            echo "NAVER_MAP_CLIENT_ID=${{ secrets.NAVER_MAP_CLIENT_ID }}" >> .env
            echo "NAVER_MAP_CLIENT_SECRET=${{ secrets.NAVER_MAP_CLIENT_SECRET }}" >> .env
            echo "NCP_CLIENT_ID=${{ secrets.NCP_CLIENT_ID }}" >> .env
            echo "NCP_CLIENT_SECRET=${{ secrets.NCP_CLIENT_SECRET }}" >> .env

            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env

            echo "NODE_ENV=production" >> .env
            echo "PORT=3000" >> .env

            docker compose pull
            
            docker compose down
            docker compose up -d
